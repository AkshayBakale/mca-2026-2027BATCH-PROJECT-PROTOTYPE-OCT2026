# Netlify Configuration for AuraCycle AI

[build]
  # Publish directory for static frontend assets
  publish = "04_frontend_dashboard"

# Proxy all /api/* requests to your deployed Python backend (e.g., Render, Railway, Fly.io, or AWS)
# Replace 'https://your-auracycle-api.onrender.com' with your actual live backend URL.
[[redirects]]
  from = "/api/*"
  to = "https://your-auracycle-api.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page Application fallback for deep links
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
